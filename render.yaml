services:
  - type: web
    name: mentorminutes
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../server && npm install --omit=dev
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://mentorminutes.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
